set default=0
set timeout=3
set ORDER="A B"
set A_OK=1
set B_OK=0
set A_TRY=0
set B_TRY=0
search --no-floppy --label OMNIOS-ENV --set=envpart
load_env --file=($envpart)/grubenv
set any_ok=0
for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        INDEX=0; OK=$A_OK; TRY=$A_TRY; A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        INDEX=1; OK=$B_OK; TRY=$B_TRY; B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        default=$INDEX
        any_ok=1
        break
    fi
done
# If both sides failed one trial, clear stale flags and retry slot A.
if [ "$any_ok" -eq 0 ]; then
    if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then A_TRY=0; fi
    if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then B_TRY=0; fi
fi
save_env --file=($envpart)/grubenv A_TRY A_OK B_TRY B_OK ORDER
set cmdline="rootwait rootfstype=ext4 console=ttyS0,115200 console=tty0 quiet rauc.slot="
menuentry "OmniOS — Slot A" {
    search --no-floppy --label omnios-root-a --set=roota
    linux ($roota)/boot/bzImage root=LABEL=omnios-root-a ${cmdline}A
}
menuentry "OmniOS — Slot B" {
    search --no-floppy --label omnios-root-b --set=rootb
    linux ($rootb)/boot/bzImage root=LABEL=omnios-root-b ${cmdline}B
}
