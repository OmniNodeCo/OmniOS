name: Build OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build the complete OmniOS ISO
        required: true
        default: true
        type: boolean
      run_boot_tests:
        description: Run the BIOS and UEFI QEMU boot tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: omnios-debian-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5

      - name: Configure version and nightly download
        run: |
          version="$(scripts/read-version.sh)"
          artifact_name="OmniOS-${version}-amd64"
          encoded_ref="$(jq -rn --arg value "$GITHUB_REF_NAME" '$value | @uri')"
          nightly_url="https://nightly.link/${GITHUB_REPOSITORY}/workflows/build/${encoded_ref}/${artifact_name}.zip"

          echo "OMNIOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "OMNIOS_ARTIFACT=$artifact_name" >> "$GITHUB_ENV"
          echo "OMNIOS_NIGHTLY_URL=$nightly_url" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install validation and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils ovmf qemu-system-x86 shellcheck

      - name: Validate OmniOS configuration
        run: scripts/check-project.sh

      - name: Restore Debian package cache
        uses: actions/cache@v5
        with:
          path: build/downloads
          key: omnios-debian13-${{ hashFiles('version.txt', 'auto/**', 'config/package-lists/**', 'config/hooks/**') }}
          restore-keys: omnios-debian13-

      - name: Build Debian 13 KDE live/install ISO
        if: inputs.full_build
        run: scripts/build-container.sh

      - name: Verify ISO checksum
        if: inputs.full_build
        run: |
          cd out
          sha256sum --check "$OMNIOS_ARTIFACT.iso.sha256"

      - name: Boot smoke test (legacy BIOS)
        if: inputs.full_build && inputs.run_boot_tests
        run: scripts/smoke-test.sh

      - name: Boot smoke test (UEFI)
        if: inputs.full_build && inputs.run_boot_tests
        env:
          QEMU_UEFI: "1"
        run: scripts/smoke-test.sh

      - name: Finalize build metadata
        if: inputs.full_build
        run: |
          rm -f out/OVMF*.fd
          cp version.txt out/VERSION.txt
          printf '%s\n' "$OMNIOS_NIGHTLY_URL" > out/NIGHTLY-LINK.txt
          cat > out/RELEASE-METADATA <<EOF
          source_commit=$GITHUB_SHA
          source_ref=$GITHUB_REF_NAME
          workflow_run_id=$GITHUB_RUN_ID
          version=$OMNIOS_VERSION
          artifact=$OMNIOS_ARTIFACT
          nightly_url=$OMNIOS_NIGHTLY_URL
          base=Debian_13_trixie
          architecture=amd64
          EOF
          (
            cd out
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | sort | xargs sha256sum > SHA256SUMS
          )
          ls -lh out

      - name: Upload versioned OmniOS ISO
        if: inputs.full_build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OMNIOS_ARTIFACT }}
          path: out/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Show nightly download
        if: inputs.full_build
        run: |
          {
            echo '## OmniOS nightly download'
            echo
            echo "[$OMNIOS_ARTIFACT.zip]($OMNIOS_NIGHTLY_URL)"
            echo
            echo "Version source: \`version.txt\` (\`$OMNIOS_VERSION\`)"
          } >> "$GITHUB_STEP_SUMMARY"
