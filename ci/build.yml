name: Build OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build and boot-test the complete OmniOS ISO
        required: true
        default: true
        type: boolean
      release_revision:
        description: Monotonic release revision used by the release workflow
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: omnios-debian-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5

      - name: Validate release revision
        env:
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          [[ "$RELEASE_REVISION" =~ ^[0-9]+$ ]] || {
            echo "release_revision must contain digits only" >&2
            exit 1
          }
          echo "OMNIOS_RELEASE_REVISION=$RELEASE_REVISION" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install validation and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils ovmf qemu-system-x86 shellcheck

      - name: Validate OmniOS configuration
        run: scripts/check-project.sh

      - name: Restore Debian package cache
        uses: actions/cache@v5
        with:
          path: build/cache
          key: omnios-debian13-${{ hashFiles('auto/**', 'config/package-lists/**', 'config/hooks/**') }}
          restore-keys: omnios-debian13-

      - name: Build Debian 13 KDE live/install ISO
        if: inputs.full_build
        run: scripts/build-container.sh

      - name: Verify ISO checksum
        if: inputs.full_build
        run: |
          cd out
          sha256sum --check OmniOS-1.0-amd64.iso.sha256

      - name: Boot smoke test (legacy BIOS)
        if: inputs.full_build
        run: scripts/smoke-test.sh

      - name: Boot smoke test (UEFI)
        if: inputs.full_build
        env:
          QEMU_UEFI: "1"
        run: scripts/smoke-test.sh

      - name: Finalize release metadata
        if: inputs.full_build
        run: |
          rm -f out/OVMF*.fd
          cat > out/RELEASE-METADATA <<EOF
          source_commit=$GITHUB_SHA
          source_ref=$GITHUB_REF_NAME
          workflow_run_id=$GITHUB_RUN_ID
          release_revision=$OMNIOS_RELEASE_REVISION
          version=1.0.$OMNIOS_RELEASE_REVISION
          base=Debian_13_trixie
          architecture=amd64
          EOF
          (
            cd out
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | sort | xargs sha256sum > SHA256SUMS
          )
          ls -lh out

      - name: Upload OmniOS ISO
        if: inputs.full_build
        uses: actions/upload-artifact@v4
        with:
          name: OmniOS-1.0-amd64
          path: out/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
