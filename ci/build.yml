name: Build OmniOS Yocto Image
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build the complete KDE Plasma disk image
        required: true
        default: true
        type: boolean
      release_revision:
        description: Monotonic patch revision (OmniOS bundle version 1.0.REVISION)
        required: true
        default: "0"
        type: string
      require_production_signing:
        description: Fail unless production RAUC signing secrets are configured
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: omnios-yocto-x86-64
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.require_production_signing && 'production' || 'development' }}
    timeout-minutes: 360
    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /
      - name: Install Yocto host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential chrpath cpio debianutils diffstat file gawk gcc git \
            iputils-ping libacl1 liblz4-tool locales openssl python3 python3-git python3-jinja2 \
            python3-pexpect python3-pip python3-subunit python3-venv ovmf qemu-system-x86 \
            socat texinfo unzip wget xz-utils zstd
          python3 -m venv .venv
          .venv/bin/pip install kas==5.5 shellcheck-py
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_US.UTF-8
      - name: Validate project
        run: scripts/check-layer.sh
      - name: Configure release revision
        env:
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          [[ "$RELEASE_REVISION" =~ ^[0-9]+$ ]] || {
            echo "release_revision must contain digits only" >&2
            exit 1
          }
          mkdir -p build
          cat > build/ci-overrides.yml <<EOF
          header:
            version: 19
          local_conf_header:
            ci-release: |
              OMNIOS_RELEASE_REVISION = "$RELEASE_REVISION"
          EOF
          echo "KAS_FILE=$GITHUB_WORKSPACE/kas/omnios-x86_64.yml:$GITHUB_WORKSPACE/build/ci-overrides.yml" >> "$GITHUB_ENV"
          echo "OMNIOS_RELEASE_REVISION=$RELEASE_REVISION" >> "$GITHUB_ENV"
      - name: Restore Yocto downloads
        uses: actions/cache@v5
        with:
          path: build/downloads
          key: omnios-wrynose-downloads-${{ hashFiles('kas/*.yml', 'meta-omnios/**/*.bb*') }}
          restore-keys: omnios-wrynose-downloads-
      - name: Check out pinned layers
        run: scripts/build.sh checkout
      - name: Parse metadata
        run: scripts/build.sh parse
      - name: Configure RAUC release signer
        if: inputs.full_build
        env:
          REQUIRE_PRODUCTION_SIGNING: ${{ inputs.require_production_signing }}
          RAUC_KEYRING_B64: ${{ secrets.OMNIOS_RAUC_KEYRING_PEM_B64 }}
          RAUC_CERT_B64: ${{ secrets.OMNIOS_RAUC_CERT_PEM_B64 }}
          RAUC_KEY_B64: ${{ secrets.OMNIOS_RAUC_KEY_PEM_B64 }}
        run: |
          mkdir -p .keys/rauc
          chmod 0700 .keys/rauc
          if [[ "$REQUIRE_PRODUCTION_SIGNING" != true ]]; then
            rmdir .keys/rauc .keys
            scripts/generate-rauc-keys.sh
            signing_profile=development
          else
            if [[ -z "$RAUC_KEYRING_B64" || -z "$RAUC_CERT_B64" || -z "$RAUC_KEY_B64" ]]; then
              echo "Production signing requires all three RAUC signing secrets" >&2
              exit 1
            fi
            printf '%s' "$RAUC_KEYRING_B64" | base64 --decode > .keys/rauc/keyring.pem
            printf '%s' "$RAUC_CERT_B64" | base64 --decode > .keys/rauc/release.cert.pem
            printf '%s' "$RAUC_KEY_B64" | base64 --decode > .keys/rauc/release.key.pem
            chmod 0644 .keys/rauc/keyring.pem .keys/rauc/release.cert.pem
            chmod 0600 .keys/rauc/release.key.pem
            openssl x509 -in .keys/rauc/release.cert.pem -noout -checkend 2592000
            openssl pkey -in .keys/rauc/release.key.pem -check -noout
            openssl verify -CAfile .keys/rauc/keyring.pem .keys/rauc/release.cert.pem
            cert_public="$(openssl x509 -in .keys/rauc/release.cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            key_public="$(openssl pkey -in .keys/rauc/release.key.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            [[ "$cert_public" == "$key_public" ]] || {
              echo "RAUC certificate and private key do not match" >&2
              exit 1
            }
            signing_profile=production
          fi
          echo "SIGNING_PROFILE=$signing_profile" >> "$GITHUB_ENV"
      - name: Build image and signed bundle
        if: inputs.full_build
        run: scripts/build.sh build
      - name: Generate RPM repository metadata
        if: inputs.full_build
        run: scripts/build.sh feed
      - name: Boot smoke test (legacy BIOS)
        if: inputs.full_build
        run: scripts/smoke-test.sh
      - name: Boot smoke test (UEFI)
        if: inputs.full_build
        env:
          QEMU_UEFI: "1"
        run: scripts/smoke-test.sh
      - name: Collect release artifacts
        if: inputs.full_build
        run: |
          mkdir -p out
          rm -f out/*.wic out/OVMF*.fd
          find build/tmp/deploy/images/genericx86-64 -maxdepth 1 -type f \
            \( -name 'omnios-plasma-image*.wic.zst' -o -name 'omnios-plasma-image*.wic.bmap' \
            -o -name 'omnios-plasma-image*.manifest' -o -name 'omnios-update-bundle*.raucb' \
            -o -name 'bzImage*' \) -exec cp -L {} out/ \;
          cp .keys/rauc/keyring.pem out/RAUC-KEYRING.pem
          cp .keys/rauc/release.cert.pem out/RAUC-RELEASE-CERT.pem
          printf '%s\n' "$SIGNING_PROFILE" > out/SIGNING-PROFILE
          cat > out/RELEASE-METADATA <<EOF
          source_commit=$GITHUB_SHA
          source_ref=$GITHUB_REF_NAME
          workflow_run_id=$GITHUB_RUN_ID
          release_revision=$OMNIOS_RELEASE_REVISION
          bundle_version=1.0.$OMNIOS_RELEASE_REVISION
          signing_profile=$SIGNING_PROFILE
          EOF
          (cd out && sha256sum * > SHA256SUMS)
          ls -lh out
      - name: Upload OmniOS image
        if: inputs.full_build
        uses: actions/upload-artifact@v4
        with:
          name: OmniOS-1.0-x86_64
          path: out/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
