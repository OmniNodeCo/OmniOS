name: Release OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release, for example 2026.1 (published as tag v2026.1). Leave blank to use the latest successful build.'
        required: false
        default: ""
        type: string
      mark_latest:
        description: Mark this release as the Latest release
        required: false
        default: true
        type: boolean
      prerelease:
        description: Publish as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: omnios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report release token
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
          HAS_PAT_TOKEN: ${{ secrets.PAT_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_TOKEN" == "true" ]]; then
            echo 'Publishing releases with the RELEASE_TOKEN secret.'
          elif [[ "$HAS_GH_TOKEN" == "true" ]]; then
            echo 'Publishing releases with the GH_TOKEN secret.'
          elif [[ "$HAS_PAT_TOKEN" == "true" ]]; then
            echo 'Publishing releases with the PAT_TOKEN secret.'
          else
            echo 'Publishing releases with the built-in GITHUB_TOKEN.'
            echo 'Set a RELEASE_TOKEN secret to publish with a personal access token instead.'
          fi

      - name: Verify the token can publish releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || github.token }}
        run: |
          # Downloading the ISO takes several minutes, so prove up front that
          # this token can actually write releases. A draft release is the
          # cheapest true write test: it creates no git tag and is deleted
          # immediately afterwards.
          probe_tag="ci-release-permission-probe-$GITHUB_RUN_ID"

          if output="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$probe_tag" \
            -F draft=true \
            -f name='OmniOS release permission probe' \
            -f body='Temporary draft created to verify release permissions. Safe to delete.' \
            --jq '.id' 2>&1)"; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$output" >/dev/null 2>&1 \
              || echo "::warning::Could not delete probe draft release $output; delete it manually."
            echo 'Release write access confirmed.'

            # Tagging a commit that is not the branch head additionally needs
            # permission to create a git ref. Report it now so the fallback
            # later in the run is expected rather than surprising.
            if gh api "repos/$GITHUB_REPOSITORY/git/refs" >/dev/null 2>&1 \
              && ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$probe_tag" \
                -f sha="$GITHUB_SHA" >/dev/null 2>&1; then
              echo '::notice::This token cannot create git tags on arbitrary commits, so the release tag will be created at the default branch head. The exact build commit is recorded in the release notes.'
            else
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$probe_tag" >/dev/null 2>&1 || true
            fi
            exit 0
          fi

          printf '%s\n' "$output" >&2

          if grep -qi 'Resource not accessible by personal access token' <<< "$output"; then
            {
              echo "::error title=Release token cannot write to $GITHUB_REPOSITORY::The personal access token was accepted but lacks write access."
              echo 'The secret is wired up correctly, but the token does not carry write access'
              echo 'to this repository. Publishing a release needs Contents: Read and write.'
              echo
              echo 'Fine-grained token checklist (Settings -> Developer settings ->'
              echo 'Personal access tokens -> Fine-grained tokens -> your token):'
              echo
              echo "  1. Resource owner must be $GITHUB_REPOSITORY_OWNER, not your personal account"
              echo '     if those differ. The owner cannot be changed after the token is made,'
              echo '     so a wrong owner means generating a new token.'
              echo "  2. Repository access must include $GITHUB_REPOSITORY."
              echo '  3. Repository permissions -> Contents must be "Read and write".'
              echo '     That dropdown defaults to "Read-only" and is the usual cause.'
              echo '  4. An organization-owned token may still need admin approval.'
              echo '  5. Check the token has not expired.'
              echo
              echo 'A classic token needs the full "repo" scope instead.'
              echo
              echo 'Update the token, then start a NEW run.'
            } >&2
          elif grep -qi 'Resource not accessible by integration' <<< "$output"; then
            {
              echo '::error title=Release token cannot write releases::The built-in GITHUB_TOKEN is read-only for this run.'
              echo 'Fix it with ONE of the following:'
              echo
              echo '  1. Settings -> Actions -> General -> Workflow permissions'
              echo '     -> select "Read and write permissions" -> Save.'
              echo
              echo '  2. Add a personal access token that can write to this repository as the'
              echo '     RELEASE_TOKEN secret (fine-grained: Contents Read and write;'
              echo '     classic: the "repo" scope).'
              echo
              echo 'Then start a NEW run. "Re-run jobs" reuses the old permission context.'
            } >&2
          elif grep -qi 'Bad credentials' <<< "$output"; then
            echo '::error title=Invalid release token::The token secret is not a valid GitHub token. It may be mistyped or expired.' >&2
          fi

          exit 1

      - name: Resolve requested version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          requested="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          requested="${requested#[vV]}"

          if [[ -n "$requested" ]]; then
            printf '%s\n' "$requested" > requested-version.txt
            requested="$(scripts/read-version.sh requested-version.txt)"
            echo "Requested OmniOS version: $requested"
          else
            echo 'No version requested; using the latest successful build.'
          fi

          echo "requested=$requested" >> "$GITHUB_OUTPUT"

      - name: Resolve matching build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ steps.version.outputs.requested }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          runs_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f branch="$default_branch" \
            -f status=success \
            -f per_page=50)"

          run_id=""
          source_sha=""
          version=""
          seen_versions=""

          while read -r candidate_id candidate_sha; do
            [[ "$candidate_id" =~ ^[0-9]+$ ]] || continue
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || continue
            git show "$candidate_sha:version.txt" > candidate-version.txt 2>/dev/null || continue
            candidate_version="$(scripts/read-version.sh candidate-version.txt)" || continue
            seen_versions="$seen_versions $candidate_version"

            if [[ -z "$REQUESTED_VERSION" || "$candidate_version" == "$REQUESTED_VERSION" ]]; then
              run_id="$candidate_id"
              source_sha="$candidate_sha"
              version="$candidate_version"
              break
            fi
          done < <(jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"' <<< "$runs_json")

          if [[ -z "$run_id" ]]; then
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "No successful build.yml run on $default_branch built OmniOS $REQUESTED_VERSION." >&2
              echo "Versions available from recent successful builds:$(tr ' ' '\n' <<< "$seen_versions" | sort -u -V | tr '\n' ' ')" >&2
              echo "Set version.txt to $REQUESTED_VERSION, run Build OmniOS ISO, then release again." >&2
            else
              echo "No successful build.yml run was found on $default_branch." >&2
            fi
            exit 1
          fi

          artifact_name="OmniOS-${version}-amd64"
          artifacts_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty' \
            <<< "$artifacts_json")"
          artifact_size="$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0].size_in_bytes // empty' \
            <<< "$artifacts_json")"

          if [[ ! "$artifact_id" =~ ^[0-9]+$ || ! "$artifact_size" =~ ^[0-9]+$ ]]; then
            echo "Build run $run_id has no unexpired $artifact_name artifact." >&2
            echo "Artifacts present in that run:" >&2
            jq -r '.artifacts[] | "  \(.name) (expired=\(.expired))"' <<< "$artifacts_json" >&2
            exit 1
          fi

          release_tag="v$version"
          artifact_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts/$artifact_id"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          artifact_size_display="$(numfmt --to=iec-i --suffix=B "$artifact_size")"

          {
            echo "version=$version"
            echo "tag=$release_tag"
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "source_sha=$source_sha"
            echo "artifact_name=$artifact_name"
            echo "artifact_id=$artifact_id"
            echo "artifact_url=$artifact_url"
            echo "artifact_size=$artifact_size_display"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing OmniOS $version as $release_tag from build run $run_id ($source_sha)."

      - name: Free runner disk space
        run: |
          df -h /
          # The ISO plus its split parts need roughly twice the ISO size.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Download ISO from the build run
        id: iso
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
        run: |
          mkdir -p iso
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir iso
          ls -lh iso

          iso_file="iso/${ARTIFACT_NAME}.iso"
          [[ -f "$iso_file" ]] || {
            echo "Artifact $ARTIFACT_NAME does not contain ${ARTIFACT_NAME}.iso." >&2
            find iso -maxdepth 1 -type f -printf '  %f\n' >&2
            exit 1
          }

          # Verify the ISO against the checksum produced by the build.
          if [[ -f "$iso_file.sha256" ]]; then
            (cd iso && sha256sum --check "${ARTIFACT_NAME}.iso.sha256")
            echo 'ISO checksum verified against the build output.'
          else
            echo "::warning::No ${ARTIFACT_NAME}.iso.sha256 in the artifact; skipping verification."
          fi

          iso_bytes="$(stat -c '%s' "$iso_file")"
          {
            echo "iso_file=$iso_file"
            echo "iso_bytes=$iso_bytes"
            echo "iso_size=$(numfmt --to=iec-i --suffix=B "$iso_bytes")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: assets
        env:
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
          ISO_FILE: ${{ steps.iso.outputs.iso_file }}
          ISO_BYTES: ${{ steps.iso.outputs.iso_bytes }}
        run: |
          # A single release asset must stay under 2 GiB, so a larger ISO is
          # published as split parts that users rejoin with `cat`.
          limit=$(( 2 * 1024 * 1024 * 1024 ))
          part_size=$(( 1900 * 1024 * 1024 ))

          mkdir -p assets
          cp "$ISO_FILE"* assets/ 2>/dev/null || cp "$ISO_FILE" assets/

          if (( ISO_BYTES < limit )); then
            echo 'ISO fits within the 2 GiB asset limit; publishing it whole.'
            echo 'split=false' >> "$GITHUB_OUTPUT"
          else
            echo "ISO is larger than 2 GiB; splitting into ${part_size}-byte parts."
            ( cd assets && split -b "$part_size" -d -a 2 \
                "${ARTIFACT_NAME}.iso" "${ARTIFACT_NAME}.iso.part" )
            rm -f "assets/${ARTIFACT_NAME}.iso"
            # The checksum file must NOT match the .iso.part* glob users run
            # through `cat`, or it would be concatenated into the rejoined ISO.
            ( cd assets && sha256sum "${ARTIFACT_NAME}".iso.part[0-9][0-9] \
                > "${ARTIFACT_NAME}.iso-parts.sha256" )
            echo 'split=true' >> "$GITHUB_OUTPUT"
          fi

          # Guard against any asset that still exceeds the hard limit.
          oversized=0
          while IFS= read -r -d '' f; do
            size="$(stat -c '%s' "$f")"
            if (( size >= limit )); then
              echo "Asset $(basename "$f") is $size bytes, over the 2 GiB limit." >&2
              oversized=1
            fi
          done < <(find assets -maxdepth 1 -type f -print0)
          (( oversized == 0 )) || exit 1

          {
            echo 'parts<<PARTS_EOF'
            ( cd assets && find . -maxdepth 1 -type f -printf '%f\t%s\n' | sort )
            echo 'PARTS_EOF'
          } >> "$GITHUB_OUTPUT"

          ls -lh assets
          df -h /

      - name: Generate release notes
        env:
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.source_sha }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_RUN_URL: ${{ steps.build.outputs.run_url }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.build.outputs.artifact_url }}
          ARTIFACT_SIZE: ${{ steps.build.outputs.artifact_size }}
          ISO_SIZE: ${{ steps.iso.outputs.iso_size }}
          SPLIT: ${{ steps.assets.outputs.split }}
        run: |
          git show "$BUILD_SHA:CHANGELOG.md" > build-changelog.md
          awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
              END { if (!found) exit 1 }
          ' build-changelog.md > release-changes.md || {
            echo "CHANGELOG.md at $BUILD_SHA has no \"## [$VERSION]\" section." >&2
            exit 1
          }
          test -s release-changes.md

          cat > release-notes.md <<EOF
          # OmniOS $RELEASE_TAG

          EOF
          cat release-changes.md >> release-notes.md
          cat >> release-notes.md <<EOF

          ## Download

          The OmniOS ISO is attached to this release, so no GitHub sign-in is required.

          EOF

          if [[ "$SPLIT" == "true" ]]; then
            cat >> release-notes.md <<EOF
          \`${ARTIFACT_NAME}.iso\` is $ISO_SIZE, and a single GitHub release asset must stay under 2 GiB, so the ISO is attached as split parts. Download every \`.iso.partNN\` file into one folder and rejoin them:

          \`\`\`bash
          cat ${ARTIFACT_NAME}.iso.part* > ${ARTIFACT_NAME}.iso
          sha256sum --check ${ARTIFACT_NAME}.iso.sha256
          \`\`\`

          On Windows PowerShell:

          \`\`\`powershell
          cmd /c copy /b ${ARTIFACT_NAME}.iso.part00 + ${ARTIFACT_NAME}.iso.part01 ${ARTIFACT_NAME}.iso
          \`\`\`

          Verify the rejoined ISO with \`${ARTIFACT_NAME}.iso.sha256\` before writing it to a USB stick. \`${ARTIFACT_NAME}.iso-parts.sha256\` checks the individual parts before rejoining.
          EOF
          else
            cat >> release-notes.md <<EOF
          Download \`${ARTIFACT_NAME}.iso\` ($ISO_SIZE) and verify it before writing it to a USB stick:

          \`\`\`bash
          sha256sum --check ${ARTIFACT_NAME}.iso.sha256
          \`\`\`
          EOF
          fi

          cat >> release-notes.md <<EOF

          The original build artifact ZIP, which also contains the package manifest and ISO metadata, remains available to signed-in users: [${ARTIFACT_NAME}.zip]($ARTIFACT_URL) ($ARTIFACT_SIZE).

          ## Build source

          - Version: \`$VERSION\`
          - Release tag: \`$RELEASE_TAG\`
          - Build run: [$BUILD_RUN_ID]($BUILD_RUN_URL)
          - Source commit: \`$BUILD_SHA\` (the exact commit this ISO was built from)
          - Architecture: amd64/x86-64
          - Base: Debian 13 Stable (trixie)
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.source_sha }}
          MARK_LATEST: ${{ inputs.mark_latest }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$MARK_LATEST" == "true" ]]; then
            flags+=(--latest)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # An existing tag cannot be repointed, so --target is deliberately omitted here.
            echo "Updating existing release $RELEASE_TAG."
            action=update
            output="$(gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OmniOS $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${flags[@]}" 2>&1)" && status=0 || status=$?
          else
            action=create
            echo "Creating release $RELEASE_TAG at $BUILD_SHA."
            output="$(gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "OmniOS $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${flags[@]}" 2>&1)" && status=0 || status=$?

            # Tagging an arbitrary older commit also needs permission to create a
            # git ref, which a Contents-only token does not have. Creating the
            # tag at the branch head needs no such right, so fall back to that
            # and record the exact build commit in the release notes instead.
            if (( status != 0 )) && grep -qi 'Resource not accessible' <<< "$output"; then
              echo "::warning::Could not tag $BUILD_SHA directly; creating $RELEASE_TAG at the default branch head instead. The build commit is recorded in the release notes."
              output="$(gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "OmniOS $RELEASE_TAG" \
                --notes-file release-notes.md \
                "${flags[@]}" 2>&1)" && status=0 || status=$?
            fi
          fi

          printf '%s\n' "$output"

          if (( status != 0 )); then
            if grep -qi 'Resource not accessible by personal access token' <<< "$output"; then
              {
                echo "::error title=Cannot $action release::The personal access token cannot write releases in $GITHUB_REPOSITORY."
                echo 'The token was accepted, so the secret is wired up correctly, but it does not'
                echo 'carry write access to this repository. Creating a release needs Contents: write.'
                echo
                echo 'Fine-grained token checklist (Settings -> Developer settings ->'
                echo 'Personal access tokens -> Fine-grained tokens -> your token):'
                echo
                echo "  1. Resource owner must be $GITHUB_REPOSITORY_OWNER, not a different account."
                echo '     The owner cannot be changed later; a wrong owner means a new token.'
                echo "  2. Repository access must include $GITHUB_REPOSITORY"
                echo '     (\"Only select repositories\" -> pick it, or \"All repositories\").'
                echo '  3. Repository permissions -> Contents must be \"Read and write\".'
                echo '     The dropdown defaults to Read-only and is easy to miss.'
                echo '  4. If the token is owned by an organization, an admin may still need to'
                echo '     approve it before it works.'
                echo '  5. Confirm the token has not expired.'
                echo
                echo 'A classic token needs the full \"repo\" scope instead.'
                echo
                echo 'After editing the token, update the secret value and start a NEW run.'
                echo 'Editing a token does not change its value, so the secret only needs'
                echo 'replacing if you generated a new token.'
              } >&2
            elif grep -qi 'Resource not accessible by integration' <<< "$output"; then
              {
                echo "::error title=Cannot $action release::The built-in GITHUB_TOKEN is not allowed to write releases."
                echo "This workflow requests \"contents: write\", but a repository whose default workflow"
                echo 'permission is read-only caps that request, so GitHub answers HTTP 403.'
                echo
                echo 'Fix it with ONE of the following:'
                echo
                echo '  1. Settings -> Actions -> General -> Workflow permissions'
                echo '     -> select "Read and write permissions" -> Save.'
                echo
                echo '  2. Create a personal access token that can write to this repository:'
                echo '     - fine-grained: Contents -> Read and write on OmniOS; or'
                echo '     - classic: the "repo" scope.'
                echo '     Save it as the repository secret RELEASE_TOKEN'
                echo '     (Settings -> Secrets and variables -> Actions -> New repository secret).'
                echo '     The workflow uses RELEASE_TOKEN, GH_TOKEN or PAT_TOKEN automatically.'
                echo
                echo 'Then start a NEW run from the Actions tab. Do not use "Re-run jobs":'
                echo 'a re-run reuses the permission context of the original run.'
              } >&2
            fi
            exit "$status"
          fi

      - name: Upload ISO to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          mapfile -t upload < <(find assets -maxdepth 1 -type f | sort)
          (( ${#upload[@]} > 0 )) || { echo 'No release assets were prepared.' >&2; exit 1; }

          echo "Uploading ${#upload[@]} asset(s) to $RELEASE_TAG:"
          printf '  %s\n' "${upload[@]}"

          # --clobber replaces assets when a release is republished.
          gh release upload "$RELEASE_TAG" "${upload[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo 'Attached assets:'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'

      - name: Summarize release
        env:
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_RUN_URL: ${{ steps.build.outputs.run_url }}
          ARTIFACT_URL: ${{ steps.build.outputs.artifact_url }}
          ARTIFACT_SIZE: ${{ steps.build.outputs.artifact_size }}
          ISO_SIZE: ${{ steps.iso.outputs.iso_size }}
          SPLIT: ${{ steps.assets.outputs.split }}
          PARTS: ${{ steps.assets.outputs.parts }}
        run: |
          {
            echo "## OmniOS $RELEASE_TAG published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Release tag | \`$RELEASE_TAG\` |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG |"
            echo "| Build run | $BUILD_RUN_URL |"
            echo "| ISO size | $ISO_SIZE |"
            echo "| Split into parts | $SPLIT |"
            echo "| Build artifact | $ARTIFACT_URL ($ARTIFACT_SIZE) |"
            echo
            echo "### Attached assets"
            echo
            echo '```'
            printf '%s\n' "$PARTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
