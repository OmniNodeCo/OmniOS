name: Release OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release, for example 2026.1 (published as tag v2026.1). Leave blank to use the latest successful build.'
        required: false
        default: ""
        type: string
      mark_latest:
        description: Mark this release as the Latest release
        required: false
        default: true
        type: boolean
      prerelease:
        description: Publish as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: omnios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report release token
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
          HAS_PAT_TOKEN: ${{ secrets.PAT_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_TOKEN" == "true" ]]; then
            echo 'Publishing releases with the RELEASE_TOKEN secret.'
          elif [[ "$HAS_GH_TOKEN" == "true" ]]; then
            echo 'Publishing releases with the GH_TOKEN secret.'
          elif [[ "$HAS_PAT_TOKEN" == "true" ]]; then
            echo 'Publishing releases with the PAT_TOKEN secret.'
          else
            echo 'Publishing releases with the built-in GITHUB_TOKEN.'
            echo 'Set a RELEASE_TOKEN secret to publish with a personal access token instead.'
          fi

      - name: Resolve requested version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          requested="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          requested="${requested#[vV]}"

          if [[ -n "$requested" ]]; then
            printf '%s\n' "$requested" > requested-version.txt
            requested="$(scripts/read-version.sh requested-version.txt)"
            echo "Requested OmniOS version: $requested"
          else
            echo 'No version requested; using the latest successful build.'
          fi

          echo "requested=$requested" >> "$GITHUB_OUTPUT"

      - name: Resolve matching build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ steps.version.outputs.requested }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          runs_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f branch="$default_branch" \
            -f status=success \
            -f per_page=50)"

          run_id=""
          source_sha=""
          version=""
          seen_versions=""

          while read -r candidate_id candidate_sha; do
            [[ "$candidate_id" =~ ^[0-9]+$ ]] || continue
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || continue
            git show "$candidate_sha:version.txt" > candidate-version.txt 2>/dev/null || continue
            candidate_version="$(scripts/read-version.sh candidate-version.txt)" || continue
            seen_versions="$seen_versions $candidate_version"

            if [[ -z "$REQUESTED_VERSION" || "$candidate_version" == "$REQUESTED_VERSION" ]]; then
              run_id="$candidate_id"
              source_sha="$candidate_sha"
              version="$candidate_version"
              break
            fi
          done < <(jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"' <<< "$runs_json")

          if [[ -z "$run_id" ]]; then
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "No successful build.yml run on $default_branch built OmniOS $REQUESTED_VERSION." >&2
              echo "Versions available from recent successful builds:$(tr ' ' '\n' <<< "$seen_versions" | sort -u -V | tr '\n' ' ')" >&2
              echo "Set version.txt to $REQUESTED_VERSION, run Build OmniOS ISO, then release again." >&2
            else
              echo "No successful build.yml run was found on $default_branch." >&2
            fi
            exit 1
          fi

          artifact_name="OmniOS-${version}-amd64"
          artifacts_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_id="$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty' \
            <<< "$artifacts_json")"
          artifact_size="$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0].size_in_bytes // empty' \
            <<< "$artifacts_json")"

          if [[ ! "$artifact_id" =~ ^[0-9]+$ || ! "$artifact_size" =~ ^[0-9]+$ ]]; then
            echo "Build run $run_id has no unexpired $artifact_name artifact." >&2
            echo "Artifacts present in that run:" >&2
            jq -r '.artifacts[] | "  \(.name) (expired=\(.expired))"' <<< "$artifacts_json" >&2
            exit 1
          fi

          release_tag="v$version"
          artifact_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts/$artifact_id"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          artifact_size_display="$(numfmt --to=iec-i --suffix=B "$artifact_size")"

          {
            echo "version=$version"
            echo "tag=$release_tag"
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "source_sha=$source_sha"
            echo "artifact_name=$artifact_name"
            echo "artifact_id=$artifact_id"
            echo "artifact_url=$artifact_url"
            echo "artifact_size=$artifact_size_display"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing OmniOS $version as $release_tag from build run $run_id ($source_sha)."

      - name: Generate release notes
        env:
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.source_sha }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_RUN_URL: ${{ steps.build.outputs.run_url }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.build.outputs.artifact_url }}
          ARTIFACT_SIZE: ${{ steps.build.outputs.artifact_size }}
        run: |
          git show "$BUILD_SHA:CHANGELOG.md" > build-changelog.md
          awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
              END { if (!found) exit 1 }
          ' build-changelog.md > release-changes.md || {
            echo "CHANGELOG.md at $BUILD_SHA has no \"## [$VERSION]\" section." >&2
            exit 1
          }
          test -s release-changes.md

          cat > release-notes.md <<EOF
          # OmniOS $RELEASE_TAG

          EOF
          cat release-changes.md >> release-notes.md
          cat >> release-notes.md <<EOF

          ## Download

          [Download ${ARTIFACT_NAME}.zip from the latest successful build]($ARTIFACT_URL) ($ARTIFACT_SIZE)

          The build artifact contains \`${ARTIFACT_NAME}.iso\`, its SHA-256 checksum, the package manifest, build metadata, and ISO metadata. GitHub requires users to sign in before downloading Actions artifacts.

          ## Build source

          - Version: \`$VERSION\`
          - Release tag: \`$RELEASE_TAG\`
          - Build run: [$BUILD_RUN_ID]($BUILD_RUN_URL)
          - Source commit: \`$BUILD_SHA\`
          - Architecture: amd64/x86-64
          - Base: Debian 13 Stable (trixie)
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.source_sha }}
          MARK_LATEST: ${{ inputs.mark_latest }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$MARK_LATEST" == "true" ]]; then
            flags+=(--latest)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # An existing tag cannot be repointed, so --target is deliberately omitted here.
            echo "Updating existing release $RELEASE_TAG."
            action=update
            output="$(gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OmniOS $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${flags[@]}" 2>&1)" && status=0 || status=$?
          else
            echo "Creating release $RELEASE_TAG at $BUILD_SHA."
            action=create
            output="$(gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "OmniOS $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${flags[@]}" 2>&1)" && status=0 || status=$?
          fi

          printf '%s\n' "$output"

          if (( status != 0 )); then
            if grep -qi 'Resource not accessible by integration' <<< "$output"; then
              {
                echo "::error title=Cannot $action release::The token for this run is not allowed to write releases."
                echo "This workflow requests \"contents: write\", but a repository whose default workflow"
                echo 'permission is read-only caps that request, so GitHub answers HTTP 403.'
                echo
                echo 'Fix it with ONE of the following:'
                echo
                echo '  1. Settings -> Actions -> General -> Workflow permissions'
                echo '     -> select "Read and write permissions" -> Save.'
                echo
                echo '  2. Create a personal access token that can write to this repository:'
                echo '     - fine-grained: Contents -> Read and write on OmniOS; or'
                echo '     - classic: the "repo" scope.'
                echo '     Save it as the repository secret RELEASE_TOKEN'
                echo '     (Settings -> Secrets and variables -> Actions -> New repository secret).'
                echo '     The workflow uses RELEASE_TOKEN, GH_TOKEN or PAT_TOKEN automatically.'
                echo
                echo 'Then start a NEW run from the Actions tab. Do not use "Re-run jobs":'
                echo 'a re-run reuses the permission context of the original run.'
              } >&2
            fi
            exit "$status"
          fi

      - name: Summarize release
        env:
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_RUN_URL: ${{ steps.build.outputs.run_url }}
          ARTIFACT_URL: ${{ steps.build.outputs.artifact_url }}
          ARTIFACT_SIZE: ${{ steps.build.outputs.artifact_size }}
        run: |
          {
            echo "## OmniOS $RELEASE_TAG published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Release tag | \`$RELEASE_TAG\` |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG |"
            echo "| Build run | $BUILD_RUN_URL |"
            echo "| Download | $ARTIFACT_URL ($ARTIFACT_SIZE) |"
          } >> "$GITHUB_STEP_SUMMARY"
