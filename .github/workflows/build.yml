name: Build OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: Ubuntu point release, or "latest"
        required: true
        default: latest
        type: string
  schedule:
    # Refresh the cached Ubuntu ISO without rebuilding OmniOS.
    - cron: "17 3 */5 * *"

permissions:
  contents: read

concurrency:
  group: omnios-iso-build
  cancel-in-progress: false

jobs:
  build:
    name: Build OmniOS from Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      REQUESTED_VERSION: ${{ inputs.ubuntu_version || 'latest' }}

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v4

      - name: Validate customization scripts
        run: bash -n scripts/*.sh assets/*.sh

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true

          sudo apt-get clean
          df -h /

      - name: Resolve the Ubuntu release
        id: release
        env:
          UBUNTU_VERSION: ${{ env.REQUESTED_VERSION }}
        run: |
          bash scripts/resolve-ubuntu-release.sh >> "$GITHUB_OUTPUT"

      - name: Restore the verified Ubuntu ISO
        id: iso-cache
        uses: actions/cache@v4
        with:
          path: iso/${{ steps.release.outputs.iso }}
          key: ubuntu-desktop-amd64-${{ steps.release.outputs.sha256 }}

      - name: Download Ubuntu on a cache miss
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          UBUNTU_VERSION: ${{ steps.release.outputs.version }}
          ISO_DIR: iso
        run: |
          bash scripts/download-ubuntu.sh

      - name: Verify the restored or downloaded ISO
        env:
          ISO_NAME: ${{ steps.release.outputs.iso }}
          ISO_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          printf '%s *%s\n' "$ISO_SHA256" "$ISO_NAME" \
            | (cd iso && sha256sum --check -)

      - name: Install ISO build tools
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            squashfs-tools \
            xorriso

      - name: Build the bootable OmniOS ISO
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_ISO: iso/${{ steps.release.outputs.iso }}
          OUTPUT_ISO: out/OmniOS-1.0-amd64.iso
          SQUASHFS_PROCESSORS: "2"
        run: |
          sudo --preserve-env=SOURCE_ISO,OUTPUT_ISO,SQUASHFS_PROCESSORS \
            bash scripts/build-iso.sh

          sudo chown -R "$USER:$USER" out
          df -h /

      - name: Verify the OmniOS checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd out
          sha256sum --check OmniOS-1.0-amd64.iso.sha256

      - name: Upload OmniOS ISO
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OmniOS-1.0-amd64
          path: |
            out/OmniOS-1.0-amd64.iso
            out/OmniOS-1.0-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Write job summary
        env:
          CACHE_HIT: ${{ steps.iso-cache.outputs.cache-hit }}
          ISO_NAME: ${{ steps.release.outputs.iso }}
          ISO_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          {
            echo "## OmniOS build"
            echo
            echo "- Base image: \`$ISO_NAME\`"
            echo "- Base SHA-256: \`$ISO_SHA256\`"
            echo "- Existing ISO cache restored: \`${CACHE_HIT:-false}\`"

            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "- Output artifact: \`OmniOS-1.0-amd64\`"
              echo "- Output image: \`OmniOS-1.0-amd64.iso\`"
            else
              echo "- Scheduled cache refresh completed."
              echo "- No final OmniOS ISO was built during this scheduled run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
