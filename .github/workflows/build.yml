name: Build OmniOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Boot-test a published release (e.g. v2026.2.3) instead of building'
        required: false
        default: ''
      variants:
        description: 'Boot test variants, separated by ";" (blank = the default set)'
        required: false
        default: ''
  # POST /repos/{owner}/{repo}/dispatches with event_type "build" builds and
  # boot-tests the default branch; client_payload may carry "release" and
  # "variants" like the inputs above.
  repository_dispatch:
    types: [build]
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'
  pull_request:

permissions:
  contents: read

env:
  OMNIOS_JOBS: 4
  # Compiler cache. Every gcc/cc call in the build (Linux kernel, musl,
  # BusyBox, the OmniOS core) goes through ccache because
  # /usr/lib/ccache is put first on PATH; the cache directory itself is
  # carried between runs by the "compiler cache" steps below.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: Build (from source)
    # boot-testing a published release needs no build
    if: ${{ !inputs.release && !github.event.client_payload.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc cpio gzip perl python3 python3-pip \
            flex bison mtools xorriso isolinux xz-utils zstd git \
            ca-certificates libc6-dev linux-libc-dev ccache
          python3 -m pip install --user --break-system-packages pycdlib
          # ccache's gcc/cc wrappers first on PATH for all later steps.
          # (The package generates them in postinst; regenerate if absent,
          # and never fail the build over the cache.)
          [ -x /usr/lib/ccache/gcc ] || sudo update-ccache-symlinks || true
          if [ -x /usr/lib/ccache/gcc ]; then
              echo /usr/lib/ccache >> "$GITHUB_PATH"
          else
              echo "::warning::ccache wrappers missing; building without the compiler cache"
          fi

      - name: Fetch upstream sources
        run: scripts/build.sh fetch

      # ------------------------------------------------------------------
      # Cache keys.
      #  * userspace: the prebuilt bc / musl sysroot / BusyBox are
      #    reused only if nothing that shapes them changed: this workflow,
      #    build.sh, their configs, the kernel patch (UAPI headers), the
      #    exact upstream commits just fetched, the compiler, the runner
      #    image and the workspace path (musl-gcc embeds absolute paths).
      #  * ccache: one entry per run, restored from the newest earlier one;
      #    ccache itself validates every object by content.
      # ------------------------------------------------------------------
      - name: Compute cache keys
        id: keys
        run: |
          image="${ImageOS:-unknown}"
          us=$( {
                  cat .github/workflows/build.yml scripts/build.sh \
                      tools/config/busybox.config patches/*
                  for p in bc musl busybox linux; do
                      echo "$p $(git -C "src/$p" rev-parse HEAD)"
                  done
                  CCACHE_DISABLE=1 gcc -dumpfullversion
                  echo "$GITHUB_WORKSPACE"
                } | sha256sum | cut -c1-20 )
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "userspace=omnios-userspace-v1-$image-$us" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: omnios-ccache-v1-${{ steps.keys.outputs.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            omnios-ccache-v1-${{ steps.keys.outputs.image }}-

      - name: Restore prebuilt userspace (bc, musl, BusyBox)
        id: userspace-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/sysroot
            build/busybox.config.resolved
            src/bc/bin
            src/musl/lib/libc.a
            src/busybox/busybox
          key: ${{ steps.keys.outputs.userspace }}

      - name: Prepare compiler cache
        continue-on-error: true   # caching must never fail a build
        run: |
          ccache --version | head -n 1
          ccache --zero-stats
          ccache --show-config | grep -E ' (cache_dir|max_size|base_dir) = ' || true
          if [ "$(command -v gcc)" != /usr/lib/ccache/gcc ]; then
              echo "::warning::gcc resolves to $(command -v gcc), not ccache"
          fi

      - name: Build toolchain + userspace + OS core
        run: scripts/build.sh userspace

      - name: Save prebuilt userspace
        continue-on-error: true   # caching must never fail a build
        if: steps.userspace-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/sysroot
            build/busybox.config.resolved
            src/bc/bin
            src/musl/lib/libc.a
            src/busybox/busybox
          key: ${{ steps.keys.outputs.userspace }}

      - name: Assemble the root filesystem
        run: scripts/build.sh rootfs

      - name: Build the kernel (with embedded initramfs)
        run: scripts/build.sh kernel

      - name: Assemble the bootable ISO (UEFI)
        run: scripts/build.sh iso

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnios-artifacts
          path: |
            build/out/*.iso
            build/out/*.iso.sha256
            build/out/*.vmx
            build/out/omnios-bzImage-*
          retention-days: 30

      - name: Show ISO checksum
        run: cat build/out/*.iso.sha256 || true

      # Stats + decide whether this run added enough to be worth uploading.
      # Runs that only touched a few OmniOS source files skip the save and
      # the next run restores the same (still valid) cache.
      - name: Compiler cache statistics
        continue-on-error: true   # caching must never fail a build
        id: ccache-stats
        if: ${{ !cancelled() }}
        env:
          RESTORED: ${{ steps.ccache-restore.outputs.cache-matched-key }}
          USERSPACE_HIT: ${{ steps.userspace-restore.outputs.cache-hit }}
        run: |
          ccache --show-stats --verbose
          stats=$(ccache --print-stats)
          counter() { printf '%s\n' "$stats" | awk -F'\t' -v k="$1" '$1 == k { print $2 }'; }
          direct=$(counter direct_cache_hit)
          pre=$(counter preprocessed_cache_hit)
          miss=$(counter cache_miss)
          direct=${direct:-0}; pre=${pre:-0}; miss=${miss:-0}
          total=$(( direct + pre + miss ))
          rate=0
          if [ "$total" -gt 0 ]; then rate=$(( (direct + pre) * 100 / total )); fi
          # new entries = misses + preprocessor-mode hits (they add direct-mode manifests)
          if [ -z "$RESTORED" ] || [ $(( pre + miss )) -ge 50 ]; then
              save=true
              # drop entries no build has used for a week so the cache stays lean
              ccache --evict-older-than 7d || true
          else
              save=false
          fi
          echo "save=$save" >> "$GITHUB_OUTPUT"
          {
            echo "### Build caches"
            echo ""
            echo "| cache | result |"
            echo "|---|---|"
            echo "| compiler (ccache) | restored from \`${RESTORED:-nothing (cold start)}\` |"
            echo "| ccache hit rate | ${rate}% (${direct} direct + ${pre} preprocessed hits, ${miss} misses) |"
            echo "| ccache saved this run | ${save} |"
            if [ "$USERSPACE_HIT" = true ]; then
              echo "| prebuilt userspace | hit (bc, musl, BusyBox not rebuilt) |"
            else
              echo "| prebuilt userspace | miss (rebuilt and saved) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        continue-on-error: true   # caching must never fail a build
        if: ${{ !cancelled() && steps.ccache-stats.outputs.save == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: omnios-ccache-v1-${{ steps.keys.outputs.image }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Boot the ISO in QEMU/KVM with VMware-like hardware and time how long the
  # desktop takes to appear (tools/boot-test.py); also signs in and opens
  # Start and Quick Settings, with screenshots (artifact omnios-boot-test).
  boot-test:
    name: Boot test (QEMU)
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get the ISO from this run's build
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: omnios-artifacts
          path: build/out

      - name: Get the ISO of a published release
        if: needs.build.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || github.event.client_payload.release }}
        run: |
          mkdir -p build/out
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir build/out \
              --pattern '*.iso' --pattern 'omnios-bzImage-*'
          ls -la build/out

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf >/dev/null
          python3 -m pip install --user --break-system-packages -q pillow || true
          # let the runner user open /dev/kvm (hardware virtualization)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          qemu-system-x86_64 --version | head -n 1
          ls -l /dev/kvm || echo "no /dev/kvm: the boot test runs without KVM (slow)"

      - name: Boot test
        env:
          VARIANTS: ${{ inputs.variants || github.event.client_payload.variants }}
        run: |
          set -- --repeat 2
          if [ -n "$VARIANTS" ]; then
              IFS=';' read -r -a list <<< "$VARIANTS"
              for v in "${list[@]}"; do set -- "$@" --variant "$v"; done
          else
              # the ISO as VMware boots it; the same kernel handed over
              # directly, with the kernel log read back (initcall times);
              # the ISO on BIOS firmware
              set -- "$@" --variant iso-efi \
                          --variant "kernel-efi:omnios.serialshell initcall_debug log_buf_len=8M" \
                          --variant iso-bios
          fi
          python3 tools/boot-test.py --iso build/out/*.iso \
              --kernel build/out/omnios-bzImage-* --out build/boot-test \
              --print-thumbs 3-desktop,4-start "$@"

      - name: Upload screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: omnios-boot-test
          path: build/boot-test
          retention-days: 30
