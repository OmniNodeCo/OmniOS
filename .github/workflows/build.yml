name: Build Custom Ubuntu ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master, ubuntu-custom ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xorriso squashfs-tools rsync wget genisoimage

      - name: Download or use existing Ubuntu ISO
        run: |
          mkdir -p iso
          UBUNTU_VERSION="24.04.1"
          UBUNTU_ISO="ubuntu-${UBUNTU_VERSION}-desktop-amd64.iso"
          DOWNLOAD_URL="https://releases.ubuntu.com/${UBUNTU_VERSION}/${UBUNTU_ISO}"

          if [ -f "iso/${UBUNTU_ISO}" ]; then
            echo "✅ Found existing ISO in repo: iso/${UBUNTU_ISO}"
          else
            echo "⬇️ Downloading Ubuntu ISO..."
            wget -c "$DOWNLOAD_URL" -O "iso/${UBUNTU_ISO}"
            echo "✅ Download complete"
          fi

      - name: Customize the ISO
        run: bash scripts/customize.sh

      - name: Build the final ISO
        run: bash scripts/build-iso.sh

      - name: Upload Custom Ubuntu ISO
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-custom-iso
          path: out/*.iso
          retention-days: 30

      - name: Show build summary
        run: |
          echo "✅ Custom Ubuntu ISO build completed!"
          ls -lh out/
