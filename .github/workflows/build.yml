name: Validate Cubic customization

on:
  workflow_dispatch:
  push:
    branches: [ubuntu-custom]
  pull_request:
    branches: [ubuntu-custom]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh assets/*.sh
          shellcheck scripts/*.sh assets/*.sh

      - name: Validate the Cubic customization plan
        run: bash scripts/customize.sh --dry-run

      - name: Check launcher help
        run: bash scripts/build-iso.sh --help

# Cubic is a desktop GUI and does not provide an unattended ISO build CLI.
# This workflow validates the scripts; create and test the ISO in Cubic.
