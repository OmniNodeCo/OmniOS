name: Build OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build the complete OmniOS ISO
        required: true
        default: true
        type: boolean
      run_boot_tests:
        description: Run the BIOS and UEFI QEMU boot tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: omnios-debian-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5

      - name: Check the installed workflow is current
        run: |
          # .github/workflows/ cannot be written by the automation that
          # maintains ci/, so an outdated copy silently keeps building the
          # previous version. Detect that here instead of failing later with a
          # confusing "no such file" on a stale ISO name.
          if ! diff -q ci/build.yml .github/workflows/build.yml >/dev/null 2>&1; then
            {
              echo '::error title=Installed build workflow is out of date::'\
          '.github/workflows/build.yml differs from ci/build.yml.'
              echo 'The running workflow is not the one in the repository, so it may still'
              echo 'reference an older OmniOS version. Reinstall it with:'
              echo
              echo '  cp ci/build.yml .github/workflows/build.yml'
              echo '  cp ci/release.yml .github/workflows/release.yml'
              echo '  git add .github/workflows && git commit -m "ci: sync workflows" && git push'
              echo
              echo 'Differences:'
              diff ci/build.yml .github/workflows/build.yml || true
            } >&2
            exit 1
          fi
          echo 'Installed build workflow matches ci/build.yml.'

      - name: Configure version and nightly download
        run: |
          # Every name comes from version.txt via scripts/build-vars.sh, so
          # this workflow never hardcodes a version and cannot drift from the
          # ISO the build actually produces.
          scripts/build-vars.sh --github-env

          artifact_name="$(scripts/build-vars.sh OMNIOS_ARTIFACT)"
          encoded_ref="$(jq -rn --arg value "$GITHUB_REF_NAME" '$value | @uri')"
          nightly_url="https://nightly.link/${GITHUB_REPOSITORY}/workflows/build/${encoded_ref}/${artifact_name}.zip"
          echo "OMNIOS_NIGHTLY_URL=$nightly_url" >> "$GITHUB_ENV"

          echo "Building OmniOS $(scripts/build-vars.sh OMNIOS_VERSION) as $artifact_name"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install validation and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils ovmf qemu-system-x86 shellcheck

      - name: Validate OmniOS configuration
        run: scripts/check-project.sh

      - name: Restore Debian package cache
        uses: actions/cache@v5
        with:
          path: build/downloads
          key: omnios-debian13-${{ hashFiles('version.txt', 'auto/**', 'config/package-lists/**', 'config/hooks/**') }}
          restore-keys: omnios-debian13-

      - name: Build Debian 13 KDE live/install ISO
        if: inputs.full_build
        run: scripts/build-container.sh

      - name: Verify ISO checksum
        if: inputs.full_build
        run: scripts/verify-iso.sh

      - name: Boot smoke test (legacy BIOS)
        if: inputs.full_build && inputs.run_boot_tests
        run: scripts/smoke-test.sh

      - name: Boot smoke test (UEFI)
        if: inputs.full_build && inputs.run_boot_tests
        env:
          QEMU_UEFI: "1"
        run: scripts/smoke-test.sh

      - name: Finalize build metadata
        if: inputs.full_build
        run: |
          rm -f out/OVMF*.fd
          cp version.txt out/VERSION.txt
          printf '%s\n' "$OMNIOS_NIGHTLY_URL" > out/NIGHTLY-LINK.txt
          cat > out/RELEASE-METADATA <<EOF
          source_commit=$GITHUB_SHA
          source_ref=$GITHUB_REF_NAME
          workflow_run_id=$GITHUB_RUN_ID
          version=$OMNIOS_VERSION
          artifact=$OMNIOS_ARTIFACT
          nightly_url=$OMNIOS_NIGHTLY_URL
          base=Debian_13_trixie
          architecture=amd64
          EOF
          (
            cd out
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | sort | xargs sha256sum > SHA256SUMS
          )
          ls -lh out

      - name: Upload versioned OmniOS ISO
        if: inputs.full_build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OMNIOS_ARTIFACT }}
          path: out/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Show nightly download
        if: inputs.full_build
        run: |
          {
            echo '## OmniOS nightly download'
            echo
            echo "[$OMNIOS_ARTIFACT.zip]($OMNIOS_NIGHTLY_URL)"
            echo
            echo "Version source: \`version.txt\` (\`$OMNIOS_VERSION\`)"
          } >> "$GITHUB_STEP_SUMMARY"
