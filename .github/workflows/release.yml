name: Release OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (blank = version.txt)'
        required: false
        default: ''
  # Pushing a version tag (e.g. v2026.2) publishes that release as well.
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  OMNIOS_JOBS: 4

jobs:
  release:
    name: Publish ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc cpio gzip perl python3 python3-pip \
            flex bison mtools xorriso isolinux xz-utils zstd git \
            ca-certificates libc6-dev linux-libc-dev
          python3 -m pip install --user --break-system-packages pycdlib

      - name: Determine version
        id: version
        env:
          # Via env, never pasted into the script: tag names may contain $(...).
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          file="$(tr -d '[:space:]' < version.txt)"
          v="$INPUT_VERSION"
          if [ -z "$v" ] && [ "$REF_TYPE" = tag ]; then v="$REF_NAME"; fi
          v="${v#v}"
          [ -n "$v" ] || v="$file"
          # The ISO name, its volume label and the OS's own version strings
          # all come from version.txt: never publish them under another tag.
          if [ "$v" != "$file" ]; then
              echo "::error::release version '$v' does not match version.txt ('$file')"
              exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          scripts/build.sh fetch
          scripts/build.sh toolchain
          scripts/build.sh musl
          scripts/build.sh userspace
          scripts/build.sh os
          scripts/build.sh rootfs
          scripts/build.sh kernel
          scripts/build.sh iso

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniOS ${{ steps.version.outputs.tag }}
          files: |
            build/out/*.iso
            build/out/*.iso.sha256
            build/out/*.vmx
          draft: false
          prerelease: false
