name: Release OmniOS ISO

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build OmniOS ISO workflow run ID
        required: true
        type: string
      tag:
        description: Release tag matching the build revision (for example v2026.1.7)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: omnios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "build_run_id must contain digits only" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v2026\.1\.([0-9]+)$ ]] || { echo "tag must use v2026.1.REVISION" >&2; exit 1; }
          tag_revision="${BASH_REMATCH[1]}"

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == success ]] || { echo "Build did not succeed" >&2; exit 1; }
          [[ "$(jq -r '.name' <<<"$run_json")" == "Build OmniOS ISO" ]] || { echo "Unexpected source workflow" >&2; exit 1; }
          source_sha="$(jq -r '.head_sha' <<<"$run_json")"
          source_branch="$(jq -r '.head_branch' <<<"$run_json")"
          source_repository="$(jq -r '.head_repository.full_name' <<<"$run_json")"
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          [[ "$source_repository" == "$GITHUB_REPOSITORY" ]] || { echo "Cross-repository artifacts are forbidden" >&2; exit 1; }
          [[ "$source_branch" == "$default_branch" ]] || { echo "Release must come from $default_branch" >&2; exit 1; }
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source commit" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "revision=$tag_revision" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: OmniOS-2026.1-amd64
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify ISO and metadata
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
          EXPECTED_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          sha256sum --check OmniOS-2026.1-amd64.iso.sha256
          metadata_value() {
            awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' RELEASE-METADATA
          }
          [[ "$(metadata_value source_commit)" == "$EXPECTED_SHA" ]] || { echo "Source commit mismatch" >&2; exit 1; }
          [[ "$(metadata_value workflow_run_id)" == "$EXPECTED_RUN_ID" ]] || { echo "Run ID mismatch" >&2; exit 1; }
          [[ "$(metadata_value release_revision)" == "$EXPECTED_REVISION" ]] || { echo "Revision mismatch" >&2; exit 1; }
          [[ "$(metadata_value version)" == "2026.1.$EXPECTED_REVISION" ]] || { echo "Version mismatch" >&2; exit 1; }
          test -s OmniOS-2026.1-amd64.iso

      - name: Prepare public release files
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p publish
          find release -maxdepth 1 -type f \
            \( -name 'OmniOS-*.iso' -o -name 'OmniOS-*.iso.sha256' \
            -o -name 'OmniOS-*.packages' -o -name 'OmniOS-*.iso-info.txt' \
            -o -name 'RELEASE-METADATA' \) -exec cp {} publish/ \;
          git show "${SOURCE_SHA}:CHANGELOG.md" > publish/CHANGELOG.md
          test -s publish/CHANGELOG.md
          (cd publish && sha256sum * > SHA256SUMS)
          ls -lh publish

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: publish/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_RUN_ID: ${{ inputs.build_run_id }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          changelog_version="${RELEASE_TAG#v}"
          changelog_version="${changelog_version%.*}"
          awk -v heading="## [$changelog_version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
              END { if (!found) exit 1 }
          ' publish/CHANGELOG.md > release-changes.md
          test -s release-changes.md

          cat > release-notes.md <<EOF
          # OmniOS ${RELEASE_TAG#v}

          EOF
          cat release-changes.md >> release-notes.md
          cat >> release-notes.md <<EOF

          ## Release provenance

          - Source commit: \`$SOURCE_SHA\`
          - Source branch: \`$SOURCE_BRANCH\`
          - Build run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID
          - Boot support: legacy BIOS and UEFI
          - Installer: Calamares

          Verify downloads using \`SHA256SUMS\` and GitHub artifact attestations before flashing.
          EOF
          release_flags=()
          [[ "$PRERELEASE" == true ]] && release_flags+=(--prerelease)
          gh release create "$RELEASE_TAG" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "OmniOS ${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
