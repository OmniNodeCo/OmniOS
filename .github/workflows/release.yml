name: Release OmniOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5

      - name: Read OmniOS version and nightly URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity_file=config/includes.chroot/usr/share/omnios/identity/os-release
          version="$(awk -F= '$1 == "VERSION_ID" { value=$2; gsub(/^"|"$/, "", value); print value; exit }' "$identity_file")"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "Invalid or missing VERSION_ID in $identity_file: $version" >&2
            exit 1
          }

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          encoded_branch="$(jq -rn --arg value "$default_branch" '$value | @uri')"
          artifact_name="OmniOS-${version}-amd64"
          nightly_url="https://nightly.link/${GITHUB_REPOSITORY}/workflows/build/${encoded_branch}/${artifact_name}.zip"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$default_branch" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "nightly_url=$nightly_url" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NIGHTLY_URL: ${{ steps.release.outputs.nightly_url }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
          NIGHTLY_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
              END { if (!found) exit 1 }
          ' CHANGELOG.md > release-changes.md
          test -s release-changes.md

          cat > release-notes.md <<EOF
          # OmniOS $VERSION

          EOF
          cat release-changes.md >> release-notes.md
          cat >> release-notes.md <<EOF

          ## Download

          [Download the latest OmniOS $VERSION ISO artifact (ZIP)]($NIGHTLY_URL)

          The ZIP contains \`${ARTIFACT_NAME}.iso\`, its SHA-256 checksum, the package manifest, and ISO metadata from the latest successful **Build OmniOS ISO** workflow on \`$NIGHTLY_BRANCH\`.

          The nightly link always follows the newest successful build for this version. Verify the extracted ISO with \`${ARTIFACT_NAME}.iso.sha256\` before flashing it.

          ## Source

          - Release commit: \`$GITHUB_SHA\`
          - Architecture: amd64/x86-64
          - Base: Debian 13 Stable (trixie)
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OmniOS v$VERSION" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OmniOS v$VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
