name: Build OmniOS APT repository

# Builds the omnios-desktop package and the signed APT repository that
# installed systems upgrade from. Publishing this is what makes an OmniOS
# change reach existing users, rather than only people who reinstall from a
# newer ISO.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the repository so installed systems receive it
        required: false
        default: true
        type: boolean
      bump_version:
        description: Increment the patch version before publishing
        required: false
        default: true
        type: boolean
  push:
    branches: [arena/019ff737-omnios]
    paths:
      - version.txt
      - 'config/includes.chroot/**'
      - 'packaging/**'
      - scripts/build-package.sh
      - scripts/build-apt-repo.sh

permissions:
  # The built repository is committed back into docs/repo and served from
  # there, so this workflow writes to the repository rather than to Pages.
  contents: write

concurrency:
  group: omnios-apt-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Check out OmniOS
        uses: actions/checkout@v5
        with:
          # The bump step compares against the previous commit, and the publish
          # step pushes, so the default single-commit checkout is not enough.
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev gnupg

      - name: Bump the patch version
        # APT only offers an upgrade when the candidate version is higher than
        # the installed one, so republishing under the same version reaches
        # nobody. Bump automatically when the packaged files changed, unless
        # this run was started by hand with bump_version off, or the pushed
        # commit already changed version.txt itself.
        if: inputs.bump_version != false
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == 'push' && -n "$BEFORE" ]] \
            && git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null \
              | grep -qx 'version.txt'; then
            echo "version.txt was set to $(scripts/read-version.sh) by this commit; leaving it alone."
            exit 0
          fi
          previous="$(scripts/read-version.sh)"
          next="$(scripts/bump-version.sh)"
          echo "Bumped OmniOS $previous -> $next"

      - name: Read version
        id: vars
        run: |
          scripts/build-vars.sh --github-env
          echo "version=$(scripts/build-vars.sh OMNIOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate OmniOS configuration
        run: scripts/check-project.sh

      - name: Build the omnios-desktop package
        run: scripts/build-package.sh

      - name: Build the APT repository
        id: repo
        env:
          OMNIOS_GPG_KEY: ${{ secrets.OMNIOS_GPG_KEY_ID }}
          OMNIOS_GPG_PRIVATE_KEY: ${{ secrets.OMNIOS_GPG_PRIVATE_KEY }}
          OMNIOS_REPO_URL: ${{ vars.OMNIOS_REPO_URL || format('https://raw.githubusercontent.com/{0}/refs/heads/{1}/docs/repo', github.repository, github.ref_name) }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"

          if [[ -n "$OMNIOS_GPG_PRIVATE_KEY" && -n "$OMNIOS_GPG_KEY" ]]; then
            printf '%s' "$OMNIOS_GPG_PRIVATE_KEY" | gpg --batch --import
            echo 'Signing with the configured OMNIOS_GPG_PRIVATE_KEY.'
          else
            # No secret configured. Rather than publish nothing, keep the
            # signing key in the repository itself: the private half lives in
            # keys/omnios-archive-signing-key.asc and the matching public half
            # ships on the image. This is a repository-scoped archive key, not
            # an identity, and anyone who can push here could replace it
            # anyway, so committing it costs nothing and makes updates work
            # without any manual setup.
            key=keys/omnios-archive-signing-key.asc
            if [[ ! -s "$key" ]]; then
              echo 'Generating the OmniOS archive signing key.'
              install -d keys
              gpg --batch --yes --pinentry-mode loopback --passphrase '' \
                --quick-generate-key 'OmniOS Archive Signing Key <omnios@omninodeco.invalid>' \
                default sign never
              fpr="$(gpg --batch --with-colons --list-secret-keys \
                | awk -F: '/^fpr:/ { print $10; exit }')"
              gpg --batch --yes --pinentry-mode loopback --passphrase '' \
                --armor --export-secret-keys "$fpr" > "$key"
              chmod 600 "$key"
              gpg --batch --yes --armor --export "$fpr" \
                > config/includes.chroot/usr/share/keyrings/omnios-archive-keyring.asc
              echo 'new_key=true' >> "$GITHUB_OUTPUT"
            else
              gpg --batch --import "$key"
              fpr="$(gpg --batch --with-colons --list-secret-keys \
                | awk -F: '/^fpr:/ { print $10; exit }')"
              # Keep the shipped public key in step with the private one.
              gpg --batch --yes --armor --export "$fpr" \
                > config/includes.chroot/usr/share/keyrings/omnios-archive-keyring.asc
            fi
            OMNIOS_GPG_KEY="$fpr"
            export OMNIOS_GPG_KEY
            echo "Signing with the repository archive key $fpr."
          fi

          scripts/build-apt-repo.sh

      - name: Verify the repository is readable by APT
        run: |
          # Prove APT can parse the indices and resolve the package, rather
          # than assuming the generated tree is correct.
          root="$RUNNER_TEMP/aptcheck"
          mkdir -p "$root"/{state/lists/partial,cache/archives/partial}
          echo "deb [trusted=yes] file://$PWD/out/repo stable main" > "$root/sources.list"

          opts=(
            -o Dir::Etc::sourcelist="$root/sources.list"
            -o Dir::Etc::sourceparts=/dev/null
            -o Dir::State="$root/state"
            -o Dir::Cache="$root/cache"
            -o Dir::Etc::preferences=/dev/null
            -o Dir::Etc::preferencesparts=/dev/null
          )
          apt-get "${opts[@]}" update
          candidate="$(apt-cache "${opts[@]}" policy omnios-desktop \
            | awk '/Candidate:/ { print $2 }')"

          echo "APT resolves omnios-desktop candidate: $candidate"
          if [[ "$candidate" != "$OMNIOS_VERSION" ]]; then
            echo "Expected candidate $OMNIOS_VERSION but APT reported '$candidate'." >&2
            exit 1
          fi

      - name: Upload the repository
        uses: actions/upload-artifact@v4
        with:
          name: omnios-apt-repo-${{ steps.vars.outputs.version }}
          path: out/repo/
          retention-days: 90
          if-no-files-found: error

      - name: Commit the repository into the git repository
        if: inputs.publish != false
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          # The repository is served straight out of this git repository over
          # raw.githubusercontent.com, so no GitHub Pages setup is needed and
          # installed systems fetch from a URL that exists as soon as this
          # commit lands.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Replace the published tree wholesale; stale indexes must not linger.
          rm -rf docs/repo
          mkdir -p docs
          cp -a out/repo docs/repo

          # Stop Pages/Jekyll from mangling the archive if it is ever enabled.
          touch docs/.nojekyll

          # Stage first: a brand new docs/repo is untracked, and untracked
          # files are invisible to git diff, so checking before staging would
          # silently skip the very first publish.
          #
          # The signing key and the public keyring are staged too. When the key
          # was generated by this run they must be kept, or the next run would
          # sign with a different key and every installed system would reject
          # the archive.
          git add -A docs/repo docs/.nojekyll
          git add -A keys config/includes.chroot/usr/share/keyrings 2>/dev/null || true
          # version.txt was bumped for this publish; without it the next run
          # would rebuild the same version and APT would offer no upgrade.
          git add -A version.txt

          if git diff --cached --quiet; then
            echo 'Published repository is already up to date.'
            exit 0
          fi

          git commit -m "repo: publish OmniOS $VERSION [skip ci]"

          # Retry once: another push can land between the checkout and here.
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          {
            echo "## OmniOS $VERSION published"
            echo
            echo 'Installed systems fetch from:'
            echo
            echo '```'
            echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/docs/repo"
            echo '```'
            echo
            echo 'They pick it up on the next unattended-upgrades run. To check now:'
            echo
            echo '```bash'
            echo 'sudo apt update && apt policy omnios-desktop'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
